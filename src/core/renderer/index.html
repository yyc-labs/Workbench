<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: file:;"
    />
    <style>
      html,
      body {
        background-color: #09090b;
      }
      html {
        color-scheme: dark;
      }
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background-color: #f5f7fb;
      }
      html[data-theme='light'] {
        color-scheme: light;
      }
      body {
        margin: 0;
      }
    </style>
    <title>IDE Electron</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

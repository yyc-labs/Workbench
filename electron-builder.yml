appId: com.yaoyuchen.yyc
productName: Workbench
artifactName: ${productName}-${version}-${arch}-setup.${ext}

directories:
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: icon
    to: icon
  - from: script
    to: script
  - from: skills
    to: skills

asarUnpack:
  - node_modules/node-pty/**

npmRebuild: false
electronDist: C:/Users/yyc20/AppData/Local/electron/Cache/electron-v42.1.0-win32-x64.zip
electronDownload:
  isVerifyChecksum: true

win:
  icon: icon/Y.ico
  executableName: Workbench
  target:
    - target: nsis
      arch:
        - x64

fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown document
    role: Editor
    icon: icon/Y.ico
  - ext: markdown
    name: Markdown Document
    description: Markdown document
    role: Editor
    icon: icon/Y.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
